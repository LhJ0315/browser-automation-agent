[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-automation-agent"
version = "0.3.0"
description = "Natural-language → JSON plan → Playwright execute → screenshot archive (+ FastAPI/RQ P0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40.0",
  "openai>=1.40.0",
  "pytest>=7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "boto3>=1.34",
  "alembic>=1.13",
  "pyjwt>=2.8",
]

[project.scripts]
browser-automation-agent = "browser_agent.cli:main"

[tool.setuptools]
py-modules = ["settings"]

[tool.setuptools.packages.find]
include = ["browser_agent*", "api*", "worker*", "store*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
